# golangci-lint configuration (v2 schema).
#
# Install:  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
# Run:      golangci-lint run
#
# The default set (errcheck, govet, ineffassign, staticcheck, unused) already
# catches the things that bit this codebase before: ignored error returns,
# functions nobody calls, and the naming rules that made package names like
# `app_user` and `json_utils` non-idiomatic.
version: "2"

linters:
  default: standard
  enable:
    # Errors compared with == instead of errors.Is, which silently stops working
    # the moment anything wraps them — and this codebase wraps a lot.
    - errorlint
    # Response and row bodies that are never closed.
    - bodyclose
    - misspell
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:
      # A failed write to a test's recorder is not a finding worth failing on.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - playhausapi
