# The web app and the API answer on one origin: nginx serves the static export and hands
# anything under /api/ to the Go container. Same-origin means the browser never sends a
# preflight, so the API's ALLOWED_ORIGINS never comes into it, and it means only this
# container has to be reachable from outside.

# The standard websocket-proxy pattern: `Connection: upgrade` only on requests that asked
# for one, `close` on everything else. Hardcoding `upgrade` would put the header on plain
# REST calls too.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # `api` is the compose service name; Docker's embedded DNS resolves it on the shared
    # network. The upgrade headers are what let /api/v1/ws survive the proxy — the Go side
    # hijacks that connection, and a proxy that drops the handshake headers turns a
    # working socket into a silent reconnect loop.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $http_host, not $host: $host drops the port, and the socket handshake compares
        # the Origin header against Host to decide whether to accept the connection
        # (websocket.go's OriginPatterns). Origin "http://localhost:3000" against a Host of
        # "localhost" is refused with a 403, so a non-default port has to survive the hop.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A lobby sits idle between turns for far longer than the 60s default, and nginx
        # closing the socket from underneath the client is indistinguishable from the
        # server going away.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;

        # expo-router's static export writes a file per route — some as `games/index.html`,
        # some as `+not-found.html` — so both shapes are tried before falling back to the
        # root document, which lets the client router take over for anything else.
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
