# The stack as it runs on the droplet.
#
# The sibling file one directory up is the *local* compose file: it builds both images
# from source and publishes the app on a port. This one never builds anything. It runs
# images that a GitHub Actions run already built and pushed to ghcr.io, pinned by digest-
# bearing tag in the .env file next to it, and it is the only file the deploy pipeline
# copies onto the server.
#
# Five containers, one network, one of them reachable from outside:
#
#     :80/:443 -> caddy -> app (nginx: static export + /api/ proxy) -> api (Go) -> Postgres (external, DATABASE_URL)
#                       -> beszel (the stats dashboard, fed by beszel-agent)
#
# The app image already fronts the API on its own origin -- see src/playhaus-app/nginx.conf
# -- so caddy is a pure TLS terminator in front of it rather than a second router. Adding a
# layer instead of replacing nginx keeps the image identical in every environment, which
# means the thing tested locally is the thing that ships.
#
# Every service carries a mem_limit. Not to save memory -- these are ceilings, not
# reservations, and their sum deliberately exceeds the box's 1 GB. The point is who dies
# when something runs away: without a limit the host OOM killer picks the largest process,
# which is always the API, and leaves nothing behind explaining why. With one, the runaway
# container is the one that dies, Docker records the OOM on it, and `docker inspect` says
# so. Use `docker stats --no-stream` before changing a number: these sit at roughly 2.5-3x
# observed steady state.
#
# mem_limit, not deploy.resources.limits -- the latter is a swarm key and `docker compose`
# ignores it without complaining.

# Fixed, so the volume names are playhaus_caddy-data and so on no matter what the directory
# on disk happens to be called. Compose otherwise derives the project name from the folder,
# and a renamed folder silently orphans the certificates.
name: playhaus

services:
    api:
        image: ${API_IMAGE}
        environment:
            ADDR: ':8080'
            # The whole database connection, password included. Written into .env by the
            # Deploy API workflow from the DATABASE_URL repository secret. The api container
            # never migrates: deploy.sh runs ph-migrate from the same image first, and the
            # API refuses to start on a schema that is behind.
            DATABASE_URL: ${DATABASE_URL}
            DEBUG: 'false'

            # config.go defaults this to true, and true means every League of Letters
            # round plays the same word. It has to be said out loud in production.
            LOL_DEV_MODE: 'false'

            # Set-but-empty means "no origins", which is the one thing an unset variable
            # cannot express (it would fall back to the two localhost dev origins). No
            # origins is correct here: every browser request arrives same-origin through
            # nginx, so CORS never comes into it, and the websocket handshake falls back
            # to coder/websocket's default of requiring Origin's host to equal Host.
            ALLOWED_ORIGINS: ''

            # Guards GET /api/v1/admin/stats. Unset means the route is never registered,
            # which is the default and what development and CI run with. Written into
            # .env by the Deploy API workflow, and only when the secret exists.
            STATS_TOKEN: ${STATS_TOKEN:-}
        mem_limit: 320m
        healthcheck:
            # busybox wget, already in the alpine runtime image; nothing had to be added
            # to the API image for this. Liveness only -- the endpoint touches no storage.
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/api/v1/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    app:
        image: ${APP_IMAGE}
        # Ordering for a manual `docker compose up`. The deploy script passes --no-deps
        # precisely to bypass this, so that shipping one half never restarts the other.
        depends_on:
            - api
        healthcheck:
            # busybox wget again, this time the one in nginx:alpine. Answering on :80 is
            # the whole claim -- nginx refuses to start at all when it cannot resolve the
            # `api` upstream in its config, so a container that is serving has already
            # proved rather more than this asks.
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        mem_limit: 64m
        restart: unless-stopped

    caddy:
        image: caddy:2-alpine
        ports:
            - '80:80'
            - '443:443'
            # HTTP/3. Harmless if nothing speaks it; a missing UDP rule is otherwise an
            # invisible slow path for browsers that try QUIC first.
            - '443:443/udp'
        environment:
            DOMAIN: ${DOMAIN}
            ACME_EMAIL: ${ACME_EMAIL}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # The certificates and the ACME account key live in caddy-data. Losing this
            # volume means re-issuing from scratch, and Let's Encrypt rate-limits that to
            # five certificates per domain per week -- so a few careless recreations can
            # leave the site without TLS for days. Treat it as precious.
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - app
        mem_limit: 96m
        restart: unless-stopped

    # The stats dashboard, at https://stats.${DOMAIN} behind Caddy. Nothing builds these
    # images; they are pinned by tag, and upgrading is editing both tags (hub and agent
    # must match) and running either deploy workflow. Neither workflow names them, so
    # deploy.sh starts them explicitly the same way it starts caddy.
    beszel:
        image: henrygd/beszel:0.20.0
        environment:
            APP_URL: https://stats.${DOMAIN}
        ports:
            # Loopback only, and only for the agent. Caddy reaches the hub as `beszel:8090`
            # over the compose network; the agent cannot, because network_mode: host takes
            # it off that network entirely.
            - '127.0.0.1:8090:8090'
        volumes:
            # The SQLite database: the admin account, the registered system, and ~30 days
            # of history. Losing it means running the first-run wizard again and issuing a
            # new agent token -- annoying, not dangerous, and no player notices.
            - beszel-data:/beszel_data
        mem_limit: 256m
        restart: unless-stopped

    beszel-agent:
        image: henrygd/beszel-agent:0.20.0
        # Host networking is what gives the agent the host's own NIC and disk counters
        # rather than a container's view of them.
        network_mode: host
        environment:
            HUB_URL: http://127.0.0.1:8090
            # Generated by the hub when the system is added, then written into .env by
            # hand with ./set-env.sh BESZEL_TOKEN. Not a GitHub secret: nobody but the
            # hub can produce it.
            TOKEN: ${BESZEL_TOKEN}
            # The hub's own ed25519 public key, and required even in token mode -- the
            # agent refuses to start without it ("Failed to load public keys"). The token
            # is how the hub knows the agent; this is how the agent knows the hub, so that
            # anything else reaching the listener cannot drive it. Both come from the same
            # Add System dialog; also at GET /api/beszel/getkey when logged in.
            KEY: ${BESZEL_KEY}
        volumes:
            - beszel-agent-data:/var/lib/beszel-agent
            # :ro stops the socket file being replaced and nothing else -- a unix socket
            # is bidirectional, so this is still full Docker API access, which is root on
            # the host. A socket proxy via DOCKER_HOST is the way to narrow it if that
            # ever matters more than the per-container charts it buys.
            - /var/run/docker.sock:/var/run/docker.sock:ro
        mem_limit: 64m
        restart: unless-stopped

volumes:
    caddy-data:
    caddy-config:
    beszel-data:
    beszel-agent-data:
