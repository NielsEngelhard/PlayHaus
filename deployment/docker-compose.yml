services:
    # A Postgres of its own, so the local stack needs nothing from the host. Production has
    # none of this: its api reaches an external database through DATABASE_URL.
    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: playhaus
            POSTGRES_PASSWORD: playhaus
            POSTGRES_DB: playhausdb
        volumes:
            - db-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U playhaus -d playhausdb']
            interval: 2s
            timeout: 3s
            retries: 15
        restart: unless-stopped

    # The same step deploy.sh runs on the droplet: migrate, seed, exit. The api waits for it.
    migrate:
        build: ../src/playhaus-api
        entrypoint: ['/app/ph-migrate']
        environment:
            DATABASE_URL: postgres://playhaus:playhaus@db:5432/playhausdb?sslmode=disable
        depends_on:
            db:
                condition: service_healthy

    api:
        build: ../src/playhaus-api
        expose:
            - '8080'
        environment:
            DATABASE_URL: postgres://playhaus:playhaus@db:5432/playhausdb?sslmode=disable
            LOL_DEV_MODE: 'false'
            ALLOWED_ORIGINS: ''
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

    app:
        build:
            context: ../src/playhaus-app
            args:
                EXPO_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost:3000}
        ports:
            - '${PUBLIC_PORT:-3000}:80'
        depends_on:
            - api
        restart: unless-stopped

volumes:
    db-data:
