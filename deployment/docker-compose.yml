services:
    api:
        build: ../src/playhaus-api
        expose:
            - '8080'
        environment:
            DB_PATH: /app/data/app.db
            LOL_DEV_MODE: 'false'
            ALLOWED_ORIGINS: ''
        volumes:
            # The sqlite file plus the -wal/-shm files WAL mode keeps beside it. The API
            # creates the directory itself on boot, so an empty volume is fine.
            - api-data:/app/data
        restart: unless-stopped

    app:
        build:
            context: ../src/playhaus-app
            args:
                EXPO_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost:3000}
        ports:
            - '${PUBLIC_PORT:-3000}:80'
        depends_on:
            - api
        restart: unless-stopped

volumes:
    api-data:
