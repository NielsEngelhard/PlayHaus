# Write this week's PubquizR quiz with a language model, commit it, and seed it into the live database.
name: Weekly quiz

on:
    schedule:
        # Wednesday 05:00 UTC, which is 07:00 in Amsterdam.
        - cron: '0 5 * * 3'
    workflow_dispatch:
        inputs:
            week:
                description: 'ISO week to write, e.g. 2026-w40. Blank means this week.'
                required: false

concurrency:
    group: weekly-quiz
    cancel-in-progress: false

jobs:
    quiz:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        defaults:
            run:
                working-directory: src/playhaus-api

        services:
            # The pubquizr tests seed the whole corpus into a throwaway schema, which is
            # the gate that proves a generated file cannot break ph-migrate.
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: playhausdb_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v5
              with:
                  go-version-file: src/playhaus-api/go.mod
                  cache-dependency-path: src/playhaus-api/go.sum

            - name: Work out which week is being written
              run: |
                  set -euo pipefail

                  week="${{ inputs.week }}"
                  if [ -z "$week" ]; then
                      # %G-%V is the ISO week the cron fired in. The corpus writes the week
                      # unpadded, so 2026-w05 has to become 2026-w5.
                      week=$(date -u +%G-w%V | sed 's/-w0/-w/')
                  fi
                  echo "WEEK=$week" >> "$GITHUB_ENV"
                  echo "Writing $week"

            - name: Write the Dutch quiz
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: go run ./cmd/quizgen -locale nl -week "$WEEK"

            # English is the same quiz in another language rather than a second quiz: the
            # two locales are question for question the same, and the app switches between
            # them mid-session.
            - name: Translate it into English
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: go run ./cmd/quizgen -locale en -from "internal/pubquizr/data/nl/weekly/$WEEK.json"

            - name: Prove both files load
              env:
                  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/playhausdb_test?sslmode=disable
              run: go test ./internal/pubquizr ./internal/quizgen

            # Committed before seeding, so a database that is unreachable still leaves the
            # week in the repo for the next Deploy API to seed.
            - name: Commit the week
              working-directory: .
              run: |
                  set -euo pipefail

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add "src/playhaus-api/internal/pubquizr/data/nl/weekly/$WEEK.json" \
                          "src/playhaus-api/internal/pubquizr/data/en/weekly/$WEEK.json"

                  if git diff --cached --quiet; then
                      echo "::error::Nothing was generated" >&2
                      exit 1
                  fi

                  git commit -m "PubquizR: weekly quiz $WEEK"
                  # A protected main rejects GITHUB_TOKEN; swap in a PAT or an App token here if it is.
                  git push origin HEAD:${{ github.ref_name }}

            - name: Seed the live database
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: |
                  set -euo pipefail

                  go run ./cmd/quizseed \
                      "internal/pubquizr/data/nl/weekly/$WEEK.json" \
                      "internal/pubquizr/data/en/weekly/$WEEK.json"
