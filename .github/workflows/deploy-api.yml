# Build the Go API, publish it to GHCR, migrate and seed the database, and roll the `api` container on the droplet.
name: Deploy API

on:
    workflow_dispatch:

concurrency:
    group: deploy-api
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v7

            - name: Work out the image reference
              run: |
                  # GHCR rejects an uppercase path, and the owner here is "NielsEngelhard".
                  owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE=ghcr.io/$owner/playhaus-api" >> "$GITHUB_ENV"
                  # Twelve characters of the commit sha. Long enough to be unique in this
                  # repo, short enough to read out over the phone during a rollback.
                  echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  # Built in, scoped to this repository by the permissions block above.
                  # No personal access token to create or rotate.
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: src/playhaus-api
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ env.TAG }}
                      ${{ env.IMAGE }}:latest
                  # The Go module cache and the compiled packages, kept between runs.
                  # Without this every push recompiles the whole dependency tree.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to the droplet
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
                  BESZEL_USER_EMAIL: ${{ secrets.BESZEL_USER_EMAIL }}
                  BESZEL_USER_PASSWORD: ${{ secrets.BESZEL_USER_PASSWORD }}
              run: |
                  set -euo pipefail

                  mkdir -p ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

                  # Trust on first use, every run. The alternative is pinning the host key
                  # in a secret; against a fixed reserved IP inside DigitalOcean's network
                  # the extra ceremony buys little, but see deployment/README.md if you
                  # want it.
                  ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

                  # The server-side stack is copied every time rather than kept in sync by
                  # hand, so the repository is the only place it is defined.
                  scp deployment/server/docker-compose.yml \
                      deployment/server/Caddyfile \
                      deployment/server/deploy.sh \
                      deployment/server/set-env.sh \
                      "deploy@$DEPLOY_HOST:/opt/playhaus/"
                  # The chown is a repair, not setup: cloud-init already leaves the
                  # directory deploy-owned. Running set-env.sh as root on the box replaces
                  # .env with a root-owned copy, and every later deploy then dies on
                  # "touch: cannot touch '.env': Permission denied" -- an error that names
                  # neither root nor the file's owner. Idempotent, so it costs nothing.
                  ssh "deploy@$DEPLOY_HOST" "sudo chown -R deploy:deploy /opt/playhaus && chmod +x /opt/playhaus/deploy.sh /opt/playhaus/set-env.sh"

                  # The connection string goes over stdin, never on a command line: an
                  # argument would show in `ps` on the droplet and in this job's log. It is
                  # written before deploy.sh runs because ph-migrate reads it from the same
                  # .env as the api. Rewritten every deploy, so rotating the password is
                  # updating the secret and re-running this workflow.
                  if [ -z "$DATABASE_URL" ]; then
                      echo "::error::The DATABASE_URL repository secret is not set" >&2
                      exit 1
                  fi
                  printf '%s' "$DATABASE_URL" | ssh "deploy@$DEPLOY_HOST" "/opt/playhaus/set-env.sh DATABASE_URL"

                  # Same stdin rule, but optional rather than required: with no STATS_TOKEN
                  # secret the API simply never registers GET /api/v1/admin/stats. Guarded
                  # because set-env.sh refuses an empty value by design, and an unset
                  # optional secret must not fail the deploy. Unsetting it again means
                  # deleting the secret *and* the line in /opt/playhaus/.env -- nothing here
                  # removes a key it did not write.
                  if [ -n "$STATS_TOKEN" ]; then
                      printf '%s' "$STATS_TOKEN" | ssh "deploy@$DEPLOY_HOST" "/opt/playhaus/set-env.sh STATS_TOKEN"
                  fi

                  # The Beszel dashboard account. Only read on the hub's very first start,
                  # but written every deploy so that a rebuilt beszel-data volume comes
                  # back with the same login rather than an open setup wizard. Optional in
                  # the same way STATS_TOKEN is: without them the hub shows the wizard.
                  if [ -n "$BESZEL_USER_EMAIL" ] && [ -n "$BESZEL_USER_PASSWORD" ]; then
                      printf '%s' "$BESZEL_USER_EMAIL" | ssh "deploy@$DEPLOY_HOST" "/opt/playhaus/set-env.sh BESZEL_USER_EMAIL"
                      printf '%s' "$BESZEL_USER_PASSWORD" | ssh "deploy@$DEPLOY_HOST" "/opt/playhaus/set-env.sh BESZEL_USER_PASSWORD"
                  fi

                  # Migrates and seeds before replacing the container; see deploy.sh.
                  ssh "deploy@$DEPLOY_HOST" "/opt/playhaus/deploy.sh API_IMAGE '$IMAGE:$TAG' api"
